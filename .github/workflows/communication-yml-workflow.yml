# .github/workflows/generate-app-yml.yml
name: Generate Application YML

on:
  workflow_call:
  workflow_dispatch:


jobs:
  setting:
    name: application yml 작성
    runs-on: ubuntu-latest

    steps:
      - name: communication 모듈 application.yml 작성
        run: |
mkdir -p communication-service/src/main/resources
cat <<EOF > communication-service/src/main/resources/application.yml
server:
  port: 8082

spring:
  application:
    name: communication-service

  data:
    mongodb:
      uri: mongodb://mongodb:${{ secrets.DB_MONGO_PORT }}/chatdb

springdoc:
  swagger-ui:
    path: /api/chatrooms/swagger-ui
  api-docs:
    path: /api/chatrooms/v3/api-docs

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
  instance:
    instance-id: "${spring.application.name}:${server.port}:${random.uuid}"
EOF

  test-setting:
    uses: ./.github/workflows/test-yml-workflow.yml
    secrets: inherit
    with:
      service-name: communication-service