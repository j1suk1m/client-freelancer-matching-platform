# .github/workflows/generate-app-yml.yml
name: Generate Application properties

on:
  workflow_call:
  workflow_dispatch:


jobs:
  setting:
    name: application properties 작성
    runs-on: ubuntu-latest

    steps:
      - name: profile 모듈 application.properties 작성
        run: |
          mkdir -p profile-service/src/main/resources
          cat <<EOF > profile-service/src/main/resources/application.properties
          server.port=8086
          spring.application.name=profile-service
          spring.datasource.url=${{ secrets.DB_MYSQL_URL }}
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.datasource.username=${{ secrets.DB_MYSQL_USER_NAME }}
          spring.datasource.password=${{ secrets.DB_MYSQL_USER_PASSWORD }}
          spring.jpa.open-in-view=false
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.properties.hibernate.show_sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.kafka.bootstrap-servers=kafka:${{ secrets.INFRA_KAFKA_PORT }}
          spring.kafka.consumer.group-id=profile-service-group
          spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
          spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
          spring.kafka.consumer.properties.spring.json.trusted.packages=*
          spring.kafka.consumer.properties.allow.auto.create.topics=false
          kafka.topic.contract.name=${{ secrets.KAFKA_TOPIC_NAME_CONTRACT }}
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          springdoc.swagger-ui.path=/api/profiles/swagger-ui
          springdoc.api-docs.path=/api/profiles/v3/api-docs
          EOF

  test-setting:
    uses: ./.github/workflows/test-yml-workflow.yml
    secrets: inherit
    with:
      service-name: profile-service