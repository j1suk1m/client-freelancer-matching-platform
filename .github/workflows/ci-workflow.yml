name: CI Test Script

#이벤트의 종류
on:
  # 특정 원격지 레포지토리의 어떤 이벤트가 발생했을때
  pull_request:
    ## 어떤 브랜치로 발생했을 때
    branches:
      - deploy-test

# 해당 job을 순서대로 실행하겠다.
# 해당 jobs는 파이프라인 형태로 작동함.
    # 입력으로 들어와서 출력이 나가는게 다음 파이프의 입력으로 들어감
    # 잡은 병렬적으로 실행 될 수 있지만 파이프라인으로 구성되게 할 수 있음.
jobs:
  # 해당 잡의 key
  ## application.yml 들 실행
  # cartpost yml 생성 로직
  code-test:
    name: 코드 테스트
    # Action은 job 실행시 가상 환경을 이용함, 그래서 원래는 요금이 듬
    # 한달의 2000분 정도.
    # 그래서 해당 프로젝트에서는 4팀이 같이 쓰니까 action을 간략화 해두었음.
    runs-on: ubuntu-latest

    steps:
      - name: 브랜치로 체크아웃
        # 메인브랜치로 이동
        uses: actions/checkout@v5

      #java가 없기 때문에 java를 설치해줘야함.
      - name: JDK 세팅
        uses: actions/setup-java@v5
        with:
          # java 버전과 벤더를 설정해줘야함
          java-version: '17'
          distribution: 'temurin'

      #cartpost application.properties 작성
      - name: cartpost 모듈 application.properties 작성
        run: |
          mkdir -p ./cartpost-service/src/main/resources
          cat <<EOF > ./cartpost-service/src/main/resources/application.properties
          server.port=8081
          spring.application.name=cartpost-service
          spring.data.web.pageable.default-page-size=10
          spring.data.web.pageable.max-page-size=50
          spring.data.web.pageable.one-indexed-parameters=true
          spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          spring.datasource.driverClassName=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.sql.init.mode=always
          spring.sql.init.platform=h2
          spring.jpa.hibernate.ddl-auto=none
          spring.jpa.show-sql=true
          spring.jpa.properties.hibernate.format_sql=true
          spring.jpa.defer-datasource-initialization=true
          spring.h2.console.enabled=false
          springdoc.swagger-ui.path=/api/commissions/swagger-ui
          springdoc.api-docs.path=/api/commissions/v3/api-docs
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          EOF

      #communication application.properties 작성
      - name: communication 모듈 application.properties 작성
        run: |
          mkdir -p ./communication-service/src/main/resources
          cat <<EOF > ./communication-service/src/main/resources/application.properties
          server.port=8082
          spring.application.name=communication-service
          spring.data.mongodb.uri=mongodb://mongodb:${{ secrets.DB_MONGO_PORT }}/chatdb
          springdoc.swagger-ui.path=/api/chatrooms/swagger-ui
          springdoc.api-docs.path=/api/chatrooms/v3/api-docs
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          EOF


      #contract  application.properties 작성
      - name: contract 모듈 application.properties 작성
        run: |
          mkdir -p ./contract-service/src/main/resources
          cat <<EOF > ./contract-service/src/main/resources/application.properties
          server.port=8083
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          spring.application.name=contract-service
          spring.jackson.property-naming-strategy=SNAKE_CASE
          spring.jpa.open-in-view=false
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.properties.hibernate.show_sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.datasource.url=${{ secrets.DB_MYSQL_URL }}
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.datasource.username=${{ secrets.DB_MYSQL_USER_NAME }}
          spring.datasource.password=${{ secrets.DB_MYSQL_USER_PASSWORD }}
          spring.batch.jdbc.initialize-schema=always
          spring.batch.job.enabled=false
          spring.kafka.bootstrap-servers=kafka:${{ secrets.INFRA_KAFKA_PORT }}
          spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
          spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
          spring.kafka.producer.acks=all
          spring.kafka.producer.properties.delivery.timeout.ms=120000
          spring.kafka.producer.properties.linger.ms=0
          spring.kafka.producer.properties.request.timeout.ms=30000
          spring.kafka.producer.properties.enable.idempotence=true
          spring.kafka.producer.properties.allow.auto.create.topics=false
          spring.kafka.consumer.group-id=contract-service
          spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
          spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
          spring.kafka.consumer.properties.spring.json.trusted.packages=
          spring.kafka.consumer.properties.allow.auto.create.topics=false
          kafka.topic.contract.name=${{ secrets.KAFKA_TOPIC_NAME_CONTRACT }}
          kafka.config.topic-partitions=1
          kafka.config.topic-replications=1
          springdoc.swagger-ui.path=/api/contracts/swagger-ui
          springdoc.api-docs.path=/api/contracts/v3/api-docs
          module.member.application.name=MEMBER-SERVICE
          module.member.application.path.member-exists=/api/internal/members/exist
          module.member.application.path.member-info=/api/internal/members
          batch.settlement.size=500
          batch.settlement.settlement-rate=0.125
          batch.settlement.interval=0 0 3 15 * ? # 매월 15일 새벽 3시
          batch.contract.size=500
          batch.contract.interval=0 * * * * *
          EOF

      # discover application.properties 작성
      - name: discovery 모듈 application.properties 작성
        run: |
          mkdir -p ./discovery-service/src/main/resources
          cat <<EOF > ./discovery-service/src/main/resources/application.properties
          server.port=${{ secrets.INFRA_EUREKA_SERVER_PORT }}
          spring.application.name=discovery-service
          eureka.client.register-with-eureka=false
          eureka.client.fetch-registry=false
          EOF

      # gateway application.properties 작성
      - name: gateway 모듈 application.properties 작성
        run: |
          mkdir -p ./gateway-service/src/main/resources
          cat <<EOF > ./gateway-service/src/main/resources/application.properties
          server.port=8000
          spring.application.name=gateway-service
          spring.cloud.gateway.server.webflux.routes[0].id=cartpost-service
          spring.cloud.gateway.server.webflux.routes[0].uri=lb://CARTPOST-SERVICE
          spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/commissions/{comissions_code}
          spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET
          spring.cloud.gateway.server.webflux.routes[0].filters[0]=GlobalExceptionHandlingFilter
          spring.cloud.gateway.server.webflux.routes[0].filters[1]=TokenAuthenticationFilter
          spring.cloud.gateway.server.webflux.routes[1].id=cartpost-service
          spring.cloud.gateway.server.webflux.routes[1].uri=lb://CARTPOST-SERVICE
          spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/commissions/**,/api/commissions,/api/carts/**
          spring.cloud.gateway.server.webflux.routes[2].id=communication-service
          spring.cloud.gateway.server.webflux.routes[2].uri=lb://COMMUNICATION-SERVICE
          spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/chats/**,/api/chats
          spring.cloud.gateway.server.webflux.routes[3].id=contract-service
          spring.cloud.gateway.server.webflux.routes[3].uri=lb://CONTRACT-SERVICE
          spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/contracts/**,/api/contracts,/api/deposits/**,/api/deposits
          spring.cloud.gateway.server.webflux.routes[4].id=member-service-need-auth
          spring.cloud.gateway.server.webflux.routes[4].uri=lb://MEMBER-SERVICE
          spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/members/healthCheck
          spring.cloud.gateway.server.webflux.routes[4].filters[0]=GlobalExceptionHandlingFilter
          spring.cloud.gateway.server.webflux.routes[4].filters[1]=TokenAuthenticationFilter
          spring.cloud.gateway.server.webflux.routes[5].id=member-service
          spring.cloud.gateway.server.webflux.routes[5].uri=lb://MEMBER-SERVICE
          spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/members/**,/api/members,/oauth2/**,/login/**,/login,/api/auth,/api/auth/**
          spring.cloud.gateway.server.webflux.routes[6].id=payment-service
          spring.cloud.gateway.server.webflux.routes[6].uri=lb://PAYMENT-SERVICE
          spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/payments/**,/api/payments
          spring.cloud.gateway.server.webflux.routes[7].id=profile-service
          spring.cloud.gateway.server.webflux.routes[7].uri=lb://PROFILE-SERVICE
          spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/experiences/**,/api/experiences,/api/ratings/**,/api/ratings,/api/resumes/**,/api/resumes,/api/self-promotions/**,/api/self-promotions,/api/tags/**,/api/tags
          spring.cloud.gateway.server.webflux.routes[8].id=search-service
          spring.cloud.gateway.server.webflux.routes[8].uri=lb://SEARCH-SERVICE
          spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/search/**,/api/recommendations/**
          cors.allowed.origin=${{ secrets.CORS_ALLOWED_ORIGIN }}
          jwt.access-token.secret=${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          jwt.claims.member-code=${{ secrets.JWT_CLAIMS_MEMBER_CODE }}
          jwt.claims.is-sign=${{ secrets.JWT_CLAIMS_IS_SIGNED }}
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          EOF

      #member application.propserties 작성
      - name: member 모듈 application.properties 작성
        run: |
          mkdir -p ./member-service/src/main/resources
          cat <<EOF > ./member-service/src/main/resources/application.properties
          server.port=8084
          spring.application.name=member-service
          spring.jpa.open-in-view=false  
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.properties.hibernate.show_sql=false
          spring.jpa.properties.hibernate.format_sql=false 
          spring.datasource.url=${{ secrets.DB_MYSQL_URL }}
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.datasource.username=${{ secrets.DB_MYSQL_USER_NAME }}
          spring.datasource.password=${{ secrets.DB_MYSQL_USER_PASSWORD }}
          spring.data.redis.host=redis
          spring.data.redis.port=${{ secrets.DB_REDIS_PORT }}
          spring.data.redis.password=${{ secrets.DB_REDIS_PASSWORD }}
          spring.security.oauth2.client.registration.kakao.client-id=${{ secrets.OAUTH_KAKAO_CLIENT_ID }}
          spring.security.oauth2.client.registration.kakao.client-secret=${{ secrets.OAUTH_KAKAO_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.kakao.scope=account_email
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.kakao.redirect-uri=${{ secrets.OAUTH_KAKAO_REDIRECT_URI }}
          spring.security.oauth2.client.registration.kakao.client-name=Kakao
          spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
          spring.security.oauth2.client.registration.naver.client-id=${{ secrets.OAUTH_NAVER_CLIENT_ID }}
          spring.security.oauth2.client.registration.naver.client-secret=${{ secrets.OAUTH_NAVER_CLIENT_PASSWORD }}
          spring.security.oauth2.client.registration.naver.scope=email
          spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.naver.redirect-uri=${{ secrets.OAUTH_NAVER_REDIRECT_URI }}
          spring.security.oauth2.client.registration.naver.client-name=Naver
          spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
          spring.security.oauth2.client.registration.google.client-id=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          spring.security.oauth2.client.registration.google.client-secret=${{ secrets.OAUTH_GOOGLE_CLIENT_PASSWORD }}
          spring.security.oauth2.client.registration.google.scope=email
          spring.security.oauth2.client.registration.google.redirect-uri=${{ secrets.OAUTH_GOOGLE_REDIRECT_URI }}
          spring.security.oauth2.client.registration.google.client-name=Google
          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id
          spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
          spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
          spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
          spring.security.oauth2.client.provider.naver.user-name-attribute=response
          spring.kafka.bootstrap-servers=kafka:${{ secrets.INFRA_KAFKA_PORT }}
          spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
          spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
          spring.kafka.producer.acks=all
          spring.kafka.producer.properties.delivery.timeout.ms=120000
          spring.kafka.producer.properties.linger.ms=0
          spring.kafka.producer.properties.request.timeout.ms=30000
          spring.kafka.producer.properties.enable.idempotence=true
          spring.kafka.producer.properties.allow.auto.create.topics=false
          kafka.topic.member.create-topic=${{ secrets.KAFKA_TOPIC_NAME_CREATE_MEMBER }}
          kafka.topic.member.update-topic=${{ secrets.KAFKA_TOPIC_NAME_UPDATE_MEMBER }}
          kafka.config.topic-partitions=1
          kafka.config.topic-replications=1
          jwt.access-token.secret=${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          jwt.access-token.ttl=${{ secrets.JWT_ACCESS_TOKEN_TTL }}  
          jwt.refresh-token.secret=${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          jwt.refresh-token.ttl=${{ secrets.JWT_REFRESH_TOKEN_TTL }}
          jwt.claims.member-code=${{ secrets.JWT_CLAIMS_MEMBER_CODE }}
          jwt.claims.is-sign=${{ secrets.JWT_CLAIMS_IS_SIGNED }}
          redirect-url.login.success=${{ secrets.REDIRECT_LOGIN_SUCCESS }}
          redirect-url.login.need-signup=${{ secrets.REDIRECT_NEED_SIGNUP }}
          redirect-url.login.failure=${{ secrets.REDIRECT_LOGIN_FAIL }}
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          springdoc.swagger-ui.path=/api/members/swagger-ui
          springdoc.api-docs.path=/api/members/v3/api-docs
          request.uri.ratings.info=lb://PROFILE-SERVICE/api/ratings
          EOF

      #payment application.properties 작성
      - name: payment 모듈 application.yml 작성
        run: |
          mkdir -p ./payment-service/src/main/resources
          cat <<EOF > ./payment-service/src/main/resources/application.properties
          server.port=8085
          spring.application.name=payment-service
          spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE
          spring.datasource.driverClassName=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.h2.console.enabled=false
          spring.sql.init.mode=always
          spring.jpa.hibernate.ddl-auto=none
          spring.jpa.show-sql=true
          spring.jpa.properties.hibernate.format_sql=true
          spring.jpa.defer-datasource-initialization=true
          springdoc.swagger-ui.path=/api/payments/swagger-ui
          springdoc.api-docs.path=/api/payments/v3/api-docs
          eureka.client.serviceUrl.defaultZone=http://discovery-service:***/eureka/
          EOF

      #profile application.properties 작성
      - name: profile 모듈 application.properties 작성
        run: |
          mkdir -p ./profile-service/src/main/resources
          cat <<EOF > ./profile-service/src/main/resources/application.properties
          server.port=8086
          spring.application.name=profile-service
          spring.datasource.url=${{ secrets.DB_MYSQL_URL }}
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.datasource.username=${{ secrets.DB_MYSQL_USER_NAME }}
          spring.datasource.password=${{ secrets.DB_MYSQL_USER_PASSWORD }}
          spring.jpa.open-in-view=false
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.properties.hibernate.show_sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.kafka.bootstrap-servers=kafka:${{ secrets.INFRA_KAFKA_PORT }}
          spring.kafka.consumer.group-id=profile-service-group
          spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
          spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
          spring.kafka.consumer.properties.spring.json.trusted.packages=*
          spring.kafka.consumer.properties.allow.auto.create.topics=false
          kafka.topic.contract.name=${{ secrets.KAFKA_TOPIC_NAME_CONTRACT }}
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          springdoc.swagger-ui.path=/api/profiles/swagger-ui
          springdoc.api-docs.path=/api/profiles/v3/api-docs
          EOF

      #search application.properties 작성
      - name: search 모듈 application.properties 작성
        run: |
          mkdir -p ./search-service/src/main/resources
          cat <<EOF > ./search-service/src/main/resources/application.properties
          server.port=8087
          spring.application.name=search-service
          spring.elasticsearch.uris=http://elasticsearch:${{ secrets.INFRA_ELASTICSEARCH_PORT }}
          spring.kafka.bootstrap-servers=kafka:${{ secrets.INFRA_KAFKA_PORT }}
          spring.kafka.consumer.group-id=search-service-group
          spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
          spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
          spring.kafka.consumer.properties.spring.json.trusted.packages=*
          spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
          spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
          topics.tag-events=${{ secrets.KAFKA_TOPIC_NAME_TAG_EVENTS }}
          topics.selfpromotion-events=${{ secrets.KAFKA_TOPIC_NAME_SELFPROMOTION_EVENTS }}
          topics.commission-events=${{ secrets.KAFKA_TOPIC_NAME_COMMISION_EVENTS }}
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          springdoc.swagger-ui.path=/api/search/swagger-ui
          springdoc.api-docs.path=/api/search/v3/api-docs
          EOF

      #cartpost application-test.properties 작성
      - name: cartpost 모듈 application.properties 작성
        run: |
          cat <<EOF > ./cartpost-service/src/main/resources/application-test.properties
          spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL;IGNORECASE=TRUE;INIT=SET REFERENTIAL_INTEGRITY FALSE
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.h2.console.enabled=false
          spring.sql.init.mode=never
          spring.sql.init.platform=h2
          spring.jpa.defer-datasource-initialization=false
          eureka.client.enabled=false
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
          EOF

      - name: communication 모듈 application-test.properties 작성
        run: |
          cat <<EOF > ./communication-service/src/main/resources/application-test.properties
          spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL;IGNORECASE=TRUE;INIT=SET REFERENTIAL_INTEGRITY FALSE
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.h2.console.enabled=false
          spring.sql.init.mode=never
          spring.sql.init.platform=h2
          spring.jpa.defer-datasource-initialization=false
          eureka.client.enabled=false
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
          EOF
          
      - name: contract 모듈 application-test.properties 작성
        run: |
          cat <<EOF > ./contract-service/src/main/resources/application-test.properties
          spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL;IGNORECASE=TRUE;INIT=SET REFERENTIAL_INTEGRITY FALSE
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.h2.console.enabled=false
          spring.sql.init.mode=never
          spring.sql.init.platform=h2
          spring.jpa.defer-datasource-initialization=false
          eureka.client.enabled=false
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
          EOF
          
      # member-service
      - name: member 모듈 application-test.properties 작성
        run: |
          cat <<EOF > ./member-service/src/main/resources/application-test.properties
          spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL;IGNORECASE=TRUE;INIT=SET REFERENTIAL_INTEGRITY FALSE
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.h2.console.enabled=false
          spring.sql.init.mode=never
          spring.sql.init.platform=h2
          spring.jpa.defer-datasource-initialization=false
          eureka.client.enabled=false
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
          EOF

      # payment-service
      - name: payment 모듈 application-test.properties 작성
        run: |
