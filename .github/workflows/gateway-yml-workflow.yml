name: Generate Application YML

on:
  workflow_call:
  workflow_dispatch:


jobs:
  setting:
    name: application properties 작성
    runs-on: ubuntu-latest

    steps:
      - name: gateway 모듈 application.properties 작성
        run: |
            mkdir -p gateway-service/src/main/resources
            cat <<EOF > gateway-service/src/main/resources/application.properties
            server.port=8000
            spring.application.name=gateway-service
            spring.cloud.gateway.server.webflux.routes[0].id=cartpost-service
            spring.cloud.gateway.server.webflux.routes[0].uri=lb://CARTPOST-SERVICE
            spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/commissions/{comissions_code}
            spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET
            spring.cloud.gateway.server.webflux.routes[0].filters[0]=GlobalExceptionHandlingFilter
            spring.cloud.gateway.server.webflux.routes[0].filters[1]=TokenAuthenticationFilter
            spring.cloud.gateway.server.webflux.routes[1].id=cartpost-service
            spring.cloud.gateway.server.webflux.routes[1].uri=lb://CARTPOST-SERVICE
            spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/commissions/**,/api/commissions,/api/carts/**
            spring.cloud.gateway.server.webflux.routes[2].id=communication-service
            spring.cloud.gateway.server.webflux.routes[2].uri=lb://COMMUNICATION-SERVICE
            spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/chats/**,/api/chats
            spring.cloud.gateway.server.webflux.routes[3].id=contract-service
            spring.cloud.gateway.server.webflux.routes[3].uri=lb://CONTRACT-SERVICE
            spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/contracts/**,/api/contracts,/api/deposits/**,/api/deposits
            spring.cloud.gateway.server.webflux.routes[4].id=member-service-need-auth
            spring.cloud.gateway.server.webflux.routes[4].uri=lb://MEMBER-SERVICE
            spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/members/healthCheck
            spring.cloud.gateway.server.webflux.routes[4].filters[0]=GlobalExceptionHandlingFilter
            spring.cloud.gateway.server.webflux.routes[4].filters[1]=TokenAuthenticationFilter
            spring.cloud.gateway.server.webflux.routes[5].id=member-service
            spring.cloud.gateway.server.webflux.routes[5].uri=lb://MEMBER-SERVICE
            spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/members/**,/api/members,/oauth2/**,/login/**,/login,/api/auth,/api/auth/**
            spring.cloud.gateway.server.webflux.routes[6].id=payment-service
            spring.cloud.gateway.server.webflux.routes[6].uri=lb://PAYMENT-SERVICE
            spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/payments/**,/api/payments
            spring.cloud.gateway.server.webflux.routes[7].id=profile-service
            spring.cloud.gateway.server.webflux.routes[7].uri=lb://PROFILE-SERVICE
            spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/experiences/**,/api/experiences,/api/ratings/**,/api/ratings,/api/resumes/**,/api/resumes,/api/self-promotions/**,/api/self-promotions,/api/tags/**,/api/tags
            spring.cloud.gateway.server.webflux.routes[8].id=search-service
            spring.cloud.gateway.server.webflux.routes[8].uri=lb://SEARCH-SERVICE
            spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/search/**,/api/recommendations/**
            cors.allowed.origin=${{ secrets.CORS_ALLOWED_ORIGIN }}
            jwt.access-token.secret=${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
            jwt.claims.member-code=${{ secrets.JWT_CLAIMS_MEMBER_CODE }}
            jwt.claims.is-sign=${{ secrets.JWT_CLAIMS_IS_SIGNED }}
            eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
            eureka.instance.instance-id=${{ secrets.EUREKA_INSTANCE_ID }}
            EOF