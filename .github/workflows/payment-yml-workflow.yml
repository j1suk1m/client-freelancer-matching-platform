# .github/workflows/generate-app-yml.yml
name: Generate Application YML

on:
  workflow_call:
  workflow_dispatch:


jobs:
  setting:
    name: application yml 작성
    runs-on: ubuntu-latest
    steps:
      - name: payment 모듈 application.yml 작성
        run: |
          mkdir -p payment-service/src/main/resources
          cat <<EOF > payment-service/src/main/resources/application.properties
          server.port=8085
          spring.application.name=payment-service
          spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE
          spring.datasource.driverClassName=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.h2.console.enabled=false
          spring.sql.init.mode=always
          spring.jpa.hibernate.ddl-auto=none
          spring.jpa.show-sql=true
          spring.jpa.properties.hibernate.format_sql=true
          spring.jpa.defer-datasource-initialization=true
          springdoc.swagger-ui.path=/api/payments/swagger-ui
          springdoc.api-docs.path=/api/payments/v3/api-docs
          eureka.client.serviceUrl.defaultZone=http://discovery-service:***/eureka/
          EOF

  test-setting:
    uses: ./.github/workflows/test-yml-workflow.yml
    secrets: inherit
    with:
      service-name: payment-service