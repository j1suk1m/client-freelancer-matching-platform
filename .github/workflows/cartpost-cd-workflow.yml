name: cartpost-service ci/cd

on:
  push:
    branches:
      - deploy-test
    paths:
      - 'cartpost-service/**'

jobs:
  releasing:
    uses: ./.github/workflows/release-workflow.yml
    secrets: inherit
    permissions:
      contents: read
      attestations: write
      packages: write
      id-token: write
    with:
      service-name: hexagon-cartpost-service
      service-dir: ./cartpost-service
      file-name: Dockerfile

  deploying:
    needs: releasing
    uses: ./.github/workflows/deploy-workflow.yml
    secrets: inherit
    with:
      service-name: hexagon-cartpost-service
      image-tag: ${{ needs.releasing.outputs.tag_name }}
