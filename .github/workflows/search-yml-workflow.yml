# .github/workflows/generate-app-yml.yml
name: Generate Application properties

on:
  workflow_call:
  workflow_dispatch:


jobs:
  setting:
    name: application properties 작성
    runs-on: ubuntu-latest

    steps:
      - name: search 모듈 application.properties 작성
        run: |
          mkdir -p search-service/src/main/resources
          cat <<'EOF' > search-service/src/main/resources/application.properties
          server.port=8087
          spring.application.name=search-service
          spring.elasticsearch.uris=http://elasticsearch:${{ secrets.INFRA_ELASTICSEARCH_PORT }}
          spring.kafka.bootstrap-servers=kafka:${{ secrets.INFRA_KAFKA_PORT }}
          spring.kafka.consumer.group-id=search-service-group
          spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
          spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
          spring.kafka.consumer.properties.spring.json.trusted.packages=*
          spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
          spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
          topics.tag-events=${{ secrets.KAFKA_TOPIC_NAME_TAG_EVENTS }}
          topics.selfpromotion-events=${{ secrets.KAFKA_TOPIC_NAME_SELFPROMOTION_EVENTS }}
          topics.commission-events=${{ secrets.KAFKA_TOPIC_NAME_COMMISION_EVENTS }}
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.uuid}
          springdoc.swagger-ui.path=/api/search/swagger-ui
          springdoc.api-docs.path=/api/search/v3/api-docs
          EOF

  test-setting:
    uses: ./.github/workflows/test-yml-workflow.yml
    secrets: inherit
    with:
      service-name: search-service