# .github/workflows/generate-app-yml.yml
name: Generate Application properties

on:
  workflow_call:
  workflow_dispatch:


jobs:
  setting:
    name: application properties 작성
    runs-on: ubuntu-latest

    steps:
      - name: member 모듈 application.properties 작성
        run: |
          mkdir -p member-service/src/main/resources
          cat <<EOF > member-service/src/main/resources/application.properties
          server.port=8084
          spring.application.name=member-service
          spring.jpa.open-in-view=false  
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.properties.hibernate.show_sql=false
          spring.jpa.properties.hibernate.format_sql=false 
          spring.datasource.url=${{ secrets.DB_MYSQL_URL }}
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.datasource.username=${{ secrets.DB_MYSQL_USER_NAME }}
          spring.datasource.password=${{ secrets.DB_MYSQL_USER_PASSWORD }}
          spring.data.redis.host=redis
          spring.data.redis.port=${{ secrets.DB_REDIS_PORT }}
          spring.data.redis.password=${{ secrets.DB_REDIS_PASSWORD }}
          spring.security.oauth2.client.registration.kakao.client-id=${{ secrets.OAUTH_KAKAO_CLIENT_ID }}
          spring.security.oauth2.client.registration.kakao.client-secret=${{ secrets.OAUTH_KAKAO_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.kakao.scope=account_email
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.kakao.redirect-uri=${{ secrets.OAUTH_KAKAO_REDIRECT_URI }}
          spring.security.oauth2.client.registration.kakao.client-name=Kakao
          spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
          spring.security.oauth2.client.registration.naver.client-id=${{ secrets.OAUTH_NAVER_CLIENT_ID }}
          spring.security.oauth2.client.registration.naver.client-secret=${{ secrets.OAUTH_NAVER_CLIENT_PASSWORD }}
          spring.security.oauth2.client.registration.naver.scope=email
          spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.naver.redirect-uri=${{ secrets.OAUTH_NAVER_REDIRECT_URI }}
          spring.security.oauth2.client.registration.naver.client-name=Naver
          spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
          spring.security.oauth2.client.registration.google.client-id=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          spring.security.oauth2.client.registration.google.client-secret=${{ secrets.OAUTH_GOOGLE_CLIENT_PASSWORD }}
          spring.security.oauth2.client.registration.google.scope=email
          spring.security.oauth2.client.registration.google.redirect-uri=${{ secrets.OAUTH_GOOGLE_REDIRECT_URI }}
          spring.security.oauth2.client.registration.google.client-name=Google
          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id
          spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
          spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
          spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
          spring.security.oauth2.client.provider.naver.user-name-attribute=response
          spring.kafka.bootstrap-servers=kafka:${{ secrets.INFRA_KAFKA_PORT }}
          spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
          spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
          spring.kafka.producer.acks=all
          spring.kafka.producer.properties.delivery.timeout.ms=120000
          spring.kafka.producer.properties.linger.ms=0
          spring.kafka.producer.properties.request.timeout.ms=30000
          spring.kafka.producer.properties.enable.idempotence=true
          spring.kafka.producer.properties.allow.auto.create.topics=false
          kafka.topic.member.create-topic=${{ secrets.KAFKA_TOPIC_NAME_CREATE_MEMBER }}
          kafka.topic.member.update-topic=${{ secrets.KAFKA_TOPIC_NAME_UPDATE_MEMBER }}
          kafka.config.topic-partitions=1
          kafka.config.topic-replications=1
          jwt.access-token.secret=${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          jwt.access-token.ttl=${{ secrets.JWT_ACCESS_TOKEN_TTL }}  
          jwt.refresh-token.secret=${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          jwt.refresh-token.ttl=${{ secrets.JWT_REFRESH_TOKEN_TTL }}
          jwt.claims.member-code=${{ secrets.JWT_CLAIMS_MEMBER_CODE }}
          jwt.claims.is-sign=${{ secrets.JWT_CLAIMS_IS_SIGNED }}
          redirect-url.login.success=${{ secrets.REDIRECT_LOGIN_SUCCESS }}
          redirect-url.login.need-signup=${{ secrets.REDIRECT_NEED_SIGNUP }}
          redirect-url.login.failure=${{ secrets.REDIRECT_LOGIN_FAIL }}
          eureka.client.serviceUrl.defaultZone=http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
          springdoc.swagger-ui.path=/api/members/swagger-ui
          springdoc.api-docs.path=/api/members/v3/api-docs
          request.uri.ratings.info=lb://PROFILE-SERVICE/api/ratings
          EOF

  test-setting:
    uses: ./.github/workflows/test-yml-workflow.yml
    secrets: inherit
    with:
      service-name: member-service