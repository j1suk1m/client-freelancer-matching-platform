# .github/workflows/generate-app-yml.yml
name: Generate Application YML

on:
  workflow_call:
    inputs:
  workflow_dispatch:


jobs:
  setting:
    name: application yml 작성
    runs-on: ubuntu-latest

    steps:
      - name: member 모듈 application.yml 작성
        run: |
          mkdir -p member-service/src/main/resources
          cat <<EOF > member-service/src/main/resources/application.yml
          server:
            port: 8084
          
          spring:
            application:
              name: member-service
          
            jpa:
              open-in-view: false #Lazy Loading 사용 시 트랜잭션 종료를 명확하게 관리하기 위해 false
              hibernate:
                ddl-auto: validate 
              properties:
                hibernate:
                  show_sql: false
                  format_sql: false #쿼리 로그를 보기 쉽게 포맷
          
            datasource:
              url: ${{ secret.DB_MYSQL_URL }}
              driver-class-name: com.mysql.cj.jdbc.Driver
              username: ${{ secrets.DB_MYSQL_USER_NAME }}
              password: ${{ secrets.DB_MYSQL_USER_PASSWORD }}
          
            data:
              redis:
                host: redis
                port: ${{ secrets.DB_REDIS_PORT }}
                password: ${{ secrets.DB_REDIS_PASSWORD }}
          
            security:
              oauth2:
                client:
                  registration:
                    kakao:
                      client-id: ${{ secrets.OAUTH_KAKAO_CLIENT_ID }}
                      client-secret: ${{ secrets.OAUTH_KAKAO_CLIENT_SECRET }}
                      scope: account_email
                      authorization-grant-type: authorization_code
                      redirect-uri: ${{ secrets.OAUTH_KAKAO_REDIRECT_URI }}
                      client-name: Kakao
                      client-authentication-method: client_secret_post
                    naver:
                      client-id: ${{ secrets.OAUTH_NAVER_CLIENT_ID }}
                      client-secret: ${{ secrets.OAUTH_NAVER_CLIENT_PASSWORD }}
                      scope: email
                      authorization-grant-type: authorization_code
                      redirect-uri: ${{ secrets.OAUTH_NAVER_REDIRECT_URI }}
                      client-name: Naver
                      client-authentication-method: client_secret_post
                    google:
                      client-id: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
                      client-secret: ${{ secrets.OAUTH_GOOGLE_CLIENT_PASSWORD }}
                      scope: email
                      redirect-uri: ${{ secrets.OAUTH_GOOGLE_REDIRECT_URI }}
                      client-name: Google
          
                provider:
                  kakao:
                    authorization-uri: https://kauth.kakao.com/oauth/authorize
                    token-uri: https://kauth.kakao.com/oauth/token
                    user-info-uri: https://kapi.kakao.com/v2/user/me
                    user-name-attribute: id
                  naver:
                    authorization-uri: https://nid.naver.com/oauth2.0/authorize
                    token-uri: https://nid.naver.com/oauth2.0/token
                    user-info-uri: https://openapi.naver.com/v1/nid/me
                    user-name-attribute: response
          
            kafka:
              bootstrap-servers:
                - kafka:${{ secrets.INFRA_KAFKA_PORT }}
          
              producer:
                key-serializer: org.apache.kafka.common.serialization.StringSerializer
                value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
                acks: all
                properties:
                  delivery.timeout.ms: 120000
                  linger.ms: 0
                  request.timeout.ms: 30000
                  enable.idempotence: true
                  allow.auto.create.topics: false
          
          kafka:
            topic:
              member:
                create-topic: ${{ secrets.KAFKA_TOPIC_NAME_CREATE_MEMBER }}
                update-topic: ${{ secrets.KAFKA_TOPIC_NAME_UPDATE_MEMBER }}
            config:
              topic-partitions: 1
              topic-replications: 1
          
          jwt:
            access-token:
              secret: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
              ttl: ${{ secrets.JWT_ACCESS_TOKEN_TTL }} #15분
          
            refresh-token:
              secret: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
              ttl: ${{ secrets.JWT_REFRESH_TOKEN_TTL }}
          
            claims:
              member-code: ${{ secrets.JWT_CLAIMS_MEMBER_CODE }}
              is-sign: ${{ secrets.JWT_CLAIMS_IS_SIGNED }}
          
          redirect-url:
            login:
              success: ${{ secrets.REDIRECT_LOGIN_SUCCESS }}
              need-signup: ${{ secrets.REDIRECT_NEED_SIGNUP }}
              failure: ${{ secrets.REDIRECT_LOGIN_FIAL }}
          
          eureka:
            client:
              serviceUrl:
                defaultZone: http://discovery-service:${{ secrets.INFRA_EUREKA_SERVER_PORT }}/eureka/
            instance:
              instance-id: "${spring.application.name}:${server.port}:${random.uuid}"
          
          springdoc:
            swagger-ui:
              path: /api/members/swagger-ui
            api-docs:
              path: /api/members/v3/api-docs
          
          request:
            uri:
              ratings:
                info: "lb://PROFILE-SERVICE/api/ratings"
          EOF

  test-setting:
    uses: ./.github/workflows/test-yml-workflow.yml
    secrets: inherit
    with:
      service-name: member-service