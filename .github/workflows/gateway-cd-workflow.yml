name: gateway-service ci/cd

on:
  push:
    branches:
      - deploy-test
    paths:
      - 'gateway-service/**'

jobs:
  setting:
    uses: ./.github/workflows/gateway-yml-workflow.yml
    secrets: inherit

  releasing:
    uses: ./.github/workflows/release-workflow.yml
    secrets: inherit
    with:
      service-name: hexagon-gateway-service
      service-dir: ./gateway-service
      file-name: Dockerfile

  deploying:
    needs: releasing
    uses: ./.github/workflows/deploy-workflow.yml
    with:
      service-name: hexagon-gateway-service
      image-tag: ${{ needs.releasing.outputs.tag_name }}
